# Captures the Solana dApp Store listing screenshots from a real Android emulator.
#
#   maestro test .maestro/store-screenshots.yaml
#
# Output lands in the working directory as store-NN-*.png (1080x2400 on the seeker_api35 AVD).
# Replaces the old web-browser captures, whose tab-bar labels were clipped.
#
# Note on the tour: the left button reads "Skip" only on step 1. From step 2 it becomes "Back",
# so the flow walks to the last step and finishes with "Start exploring".
appId: app.seekerdepin.explorer
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 5000

# Welcome screen, before the tour opens
- takeScreenshot: store-01-welcome
- tapOn: "Enter Explorer"
- waitForAnimationToEnd:
    timeout: 3000

# The guided tour explains the app to a first-time user (and to a reviewer)
- assertVisible: "A field guide to Solana hardware"
- takeScreenshot: store-02-tour-intro
- tapOn: "Next"
- waitForAnimationToEnd
- tapOn: "Next"
- waitForAnimationToEnd
- assertVisible: "Adoption confidence, not hype"
- takeScreenshot: store-03-tour-adoption
- tapOn: "Next"
- waitForAnimationToEnd
- tapOn: "Next"
- waitForAnimationToEnd
- tapOn: "Next"
- waitForAnimationToEnd
- tapOn: "Start exploring"
- waitForAnimationToEnd:
    timeout: 2000

# Explore
- assertVisible: "Explore the physical side of Solana"
- takeScreenshot: store-04-explore
- scroll
- takeScreenshot: store-05-explore-list

# Device detail. scrollUntilVisible because the list screenshots above scrolled past it.
- scrollUntilVisible:
    element:
      text: "Helium.*"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Helium.*"
    index: 0
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: store-06-device-detail
- scroll
- scroll
- takeScreenshot: store-07-device-earn
- back
- waitForAnimationToEnd

# Compare
- tapOn: "Compare"
- waitForAnimationToEnd
- takeScreenshot: store-08-compare

# Networks
- tapOn: "Networks"
- waitForAnimationToEnd
- takeScreenshot: store-09-networks

# Wallet (not connected - safe to show, no address on screen)
- tapOn: "Wallet"
- waitForAnimationToEnd
- takeScreenshot: store-10-wallet

# Security posture, aimed at reviewers and programme managers
- tapOn: "Security"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Private keys held"
- takeScreenshot: store-11-security
- scroll
- takeScreenshot: store-12-security-controls

# About, including the publisher Seeker ID
- tapOn: "About"
- waitForAnimationToEnd
- takeScreenshot: store-13-about

# Help centre, reachable from every tab. The button carries an accessibility label rather than a
# testID, so this step is optional: a miss must not cost the whole capture run.
- tapOn:
    id: "Help and app guide"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: store-14-help
