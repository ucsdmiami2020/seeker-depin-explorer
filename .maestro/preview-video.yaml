# Records the dApp Store preview video on a real Android emulator.
#
#   maestro test .maestro/preview-video.yaml
#
# Produces preview.mp4 in Maestro's debug run folder. Target the store spec: MP4, at least 720px,
# 1080p recommended — the seeker_api35 AVD records at 1080x2400.
#
# Paced deliberately: waits are long enough for a viewer to read each screen, since this is a
# marketing asset rather than a test. Roughly 50-60 seconds end to end.
appId: app.seekerdepin.explorer
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 5000
- startRecording: preview

# 1. The pitch, straight from the welcome screen
- wait:
    duration: 2500
- tapOn: "Enter Explorer"
- waitForAnimationToEnd:
    timeout: 3000

# 2. The tour explains the app in its own words
- wait:
    duration: 3000
- tapOn: "Next"
- wait:
    duration: 2500
- tapOn: "Next"
- wait:
    duration: 3000
- tapOn: "Next"
- wait:
    duration: 2500
- tapOn: "Next"
- wait:
    duration: 2500
- tapOn: "Next"
- wait:
    duration: 3000
- tapOn: "Start exploring"
- waitForAnimationToEnd:
    timeout: 2000

# 3. The catalog: browse, filter, open a device
- wait:
    duration: 2000
- scroll
- wait:
    duration: 1500
- scroll
- wait:
    duration: 1500
- tapOn:
    text: "Helium.*"
    index: 0
- waitForAnimationToEnd:
    timeout: 3000
- wait:
    duration: 2500
- scroll
- wait:
    duration: 2000
- scroll
- wait:
    duration: 2000
- back
- waitForAnimationToEnd

# 4. Compare and networks
- tapOn: "Compare"
- waitForAnimationToEnd
- wait:
    duration: 2500
- tapOn: "Networks"
- waitForAnimationToEnd
- wait:
    duration: 2500

# 5. The wallet: the reason this is a phone app
- tapOn: "Wallet"
- waitForAnimationToEnd
- wait:
    duration: 3500

# 6. Security posture, for the reviewer watching
- tapOn: "Security"
- waitForAnimationToEnd
- wait:
    duration: 3000
- scroll
- wait:
    duration: 3000

- stopRecording
